server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: evaluacion-ws-loja
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/evaluacion_ws_loja}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    org.hibernate.SQL: warn
