services:
  postgres:
    image: postgres:17-alpine
    container_name: evaluacion-ws-loja-postgres
    environment:
      POSTGRES_DB: evaluacion_ws_loja
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d evaluacion_ws_loja"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
